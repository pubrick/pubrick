services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pubrick}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pubrick}
      POSTGRES_DB: ${POSTGRES_DB:-pubrick}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports: ["127.0.0.1:5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pubrick}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build: { context: ., dockerfile: docker/api.Dockerfile }
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-pubrick}:${POSTGRES_PASSWORD:-pubrick}@postgres:5432/${POSTGRES_DB:-pubrick}
      API_PORT: "3001"
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-dev-only-secret-change-me}
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:-6DGyBr9BbF2sVZmyO8dQ7HkNq1w4x5z6A7B8C9D0E1E=}
      BETTER_AUTH_URL: ${PUBLIC_ORIGIN:-http://localhost:3000}
      WEB_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:3000}
    ports: ["3001:3001"]
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  worker:
    build: { context: ., dockerfile: docker/worker.Dockerfile }
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-pubrick}:${POSTGRES_PASSWORD:-pubrick}@postgres:5432/${POSTGRES_DB:-pubrick}
    depends_on:
      postgres: { condition: service_healthy }
      api: { condition: service_healthy }   # api healthcheck passes only after migrations ran (listen comes after runMigrations)
    restart: unless-stopped

  web:
    build: { context: ., dockerfile: docker/web.Dockerfile }
    ports: ["3000:3000"]
    depends_on: [api]
    restart: unless-stopped

volumes:
  pgdata:
