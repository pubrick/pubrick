services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pubrick}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pubrick}
      POSTGRES_DB: ${POSTGRES_DB:-pubrick}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports: ["127.0.0.1:5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pubrick}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build: { context: ., dockerfile: docker/api.Dockerfile }
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-pubrick}:${POSTGRES_PASSWORD:-pubrick}@postgres:5432/${POSTGRES_DB:-pubrick}
      API_PORT: "3001"
      # No fallbacks on purpose: an unset secret must break the install, not ship a
      # publicly known key. Generate both with `openssl rand -base64 32` (see .env.example).
      BETTER_AUTH_SECRET: "${BETTER_AUTH_SECRET:?set it in .env - generate one with `openssl rand -base64 32`, see .env.example}"
      APP_ENCRYPTION_KEY: "${APP_ENCRYPTION_KEY:?set it in .env - generate one with `openssl rand -base64 32`, see .env.example}"
      # Required, like the two secrets above and for the same reason: a silent
      # localhost fallback made a TLS install fail as a puzzling 403 (origin not
      # trusted) and serve session cookies without `Secure`, instead of refusing to
      # start. Use the origin a browser types, scheme included.
      BETTER_AUTH_URL: "${PUBLIC_ORIGIN:?set it in .env - the origin browsers use, e.g. https://pubrick.example (http://localhost:3000 for a local trial)}"
      WEB_ORIGIN: "${PUBLIC_ORIGIN:?set it in .env - the origin browsers use, e.g. https://pubrick.example (http://localhost:3000 for a local trial)}"
      # Who may register: open | invite | closed. Unset means open until the first
      # account exists, invite-only from then on — see .env.example.
      SIGNUP_MODE: ${SIGNUP_MODE:-}
      # IPs/CIDRs of the proxies in front of Pubrick. Empty means no X-Forwarded-For
      # is believed, and auth rate limiting falls back to one shared bucket per path.
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      # Leave on unless something in front of Pubrick already rate-limits /api/auth.
      AUTH_RATE_LIMIT_ENABLED: ${AUTH_RATE_LIMIT_ENABLED:-true}
    # Localhost-only: the web service proxies /api, so the api needs no public port.
    ports: ["127.0.0.1:3001:3001"]
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  worker:
    build: { context: ., dockerfile: docker/worker.Dockerfile }
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-pubrick}:${POSTGRES_PASSWORD:-pubrick}@postgres:5432/${POSTGRES_DB:-pubrick}
      # Same value as the api's — it decrypts channel credentials the api encrypted.
      # No fallback on purpose, same reasoning as the api's: see that service above.
      APP_ENCRYPTION_KEY: "${APP_ENCRYPTION_KEY:?set it in .env - generate one with `openssl rand -base64 32`, see .env.example}"
    depends_on:
      postgres: { condition: service_healthy }
      api: { condition: service_healthy }   # api healthcheck passes only after migrations ran (listen comes after runMigrations)
    restart: unless-stopped

  web:
    build: { context: ., dockerfile: docker/web.Dockerfile }
    ports: ["3000:3000"]
    depends_on: [api]
    restart: unless-stopped

volumes:
  pgdata:
