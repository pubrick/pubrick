name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: pubrick_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm typecheck
      # --force: the `test` task is cacheable, and turbo's hash covers source and declared
      # env — never the state of the Postgres service the database tier talks to. A restored
      # cache (an actions/cache step, or remote caching) would replay "success" over a
      # database that never ran a query: the same green-badge lie in another costume.
      # --concurrency=1: apps/api and apps/worker's e2e specs target the SAME
      # TEST_DATABASE_URL, and turbo would otherwise run both packages' test tasks at once —
      # four bootstrap-heavy workers against one database. This matches the local rule.
      # Not `pnpm test -- …`, which would forward the flags to vitest instead of turbo.
      - run: pnpm exec turbo run test --force --concurrency=1
        env:
          TEST_DATABASE_URL: postgres://test:test@localhost:5432/pubrick_test
          BETTER_AUTH_SECRET: pubrick-test-secret
          APP_ENCRYPTION_KEY: 6DGyBr9BbF2sVZmyO8dQ7HkNq1w4x5z6A7B8C9D0E1E=
